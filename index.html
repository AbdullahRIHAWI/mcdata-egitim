<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C3171D">
<meta name="description" content="MC Data Teknoloji yangın alarm saha eğitimi: marka eğitimleri, mühendislik kılavuzu, arıza çözüm prosedürleri ve hesaplayıcılar.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MC Data Eğitim">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>MC Data Panel Eğitimleri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: telefon öncelikli tek sütun; ana sayfa (kurslar) → kurs (konu listesi) → konu sayfası / test */
:root {
  --bg: #F4F2F1;
  --surface: #FFFFFF;
  --ink: #1D1A1A;
  --muted: #6A6260;
  --line: #DCD6D3;
  --signal: #C3171D;
  --signal-ink: #FFFFFF;
  --fault: #B9770E;
  --fault-soft: #FBF0DC;
  --ok: #2E7D4F;
  --ok-soft: #E3F2E8;
  --lcd-bg: #211D1A;
  --lcd-fg: #F3B53F;
  --chip: #ECE8E6;
  --focus: #1F6FD1;
  --art-bg: #EAE6E3;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Public Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141213; --surface: #1D1A1B; --ink: #EDE8E6; --muted: #A49B98; --line: #353030;
    --signal: #EE4448; --signal-ink: #1A0A0B; --fault: #E9A93A; --fault-soft: #332716; --ok: #5DBB83; --ok-soft: #17291F;
    --lcd-bg: #0D0B0A; --lcd-fg: #F6BE4F; --chip: #2A2526; --focus: #6AA6F0; --art-bg: #242021; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141213; --surface: #1D1A1B; --ink: #EDE8E6; --muted: #A49B98; --line: #353030;
  --signal: #EE4448; --signal-ink: #1A0A0B; --fault: #E9A93A; --fault-soft: #332716; --ok: #5DBB83; --ok-soft: #17291F;
  --lcd-bg: #0D0B0A; --lcd-fg: #F6BE4F; --chip: #2A2526; --focus: #6AA6F0; --art-bg: #242021; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15.5px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 780px; margin: 0 auto; padding-block: 0 64px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.1; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
a { color: var(--focus); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
.mark { width: 34px; height: 34px; border-radius: 50%; background: var(--signal); display: grid; place-items: center; flex: none; }
.mark i { width: 12px; height: 12px; border-radius: 50%; background: var(--signal-ink); }
.top .t { min-width: 0; flex: 1; }
.eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.top h1 { font-size: 26px; }

.back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 14px 0 4px; color: var(--muted); font-weight: 600; cursor: pointer; }
.back svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.5; fill: none; }

/* Ana sayfa */
.lead { color: var(--muted); margin: 18px 0 0; max-width: 60ch; }
.secttl { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 26px 0 10px; font-family: var(--f-body); }
.start { display: grid; grid-template-columns: 140px 1fr; gap: 16px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; cursor: pointer; }
.start:hover, .brand:hover, .topic:hover { border-color: var(--muted); }
.start h2 { font-size: 24px; }
.start .thumb svg { display: block; width: 100%; height: 100%; }
.start p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
@media (max-width: 480px) { .start { grid-template-columns: 1fr; } }
.brands { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.brand { display: grid; gap: 6px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; cursor: pointer; align-content: start; }
.brand h2 { font-size: 30px; letter-spacing: .01em; }
.brand .fam { font-size: 13px; color: var(--muted); }
.prog { display: grid; gap: 4px; margin-top: 6px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 5px; background: var(--chip); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); }

/* Kurs sayfası */
.chead { display: grid; gap: 10px; padding-top: 6px; }
.chead h2 { font-size: 40px; }
.chead p { margin: 0; max-width: 62ch; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; gap: 6px; background: var(--chip); border-radius: 4px; padding: 3px 9px; font-size: 12.5px; font-weight: 600; }
.topics { display: grid; gap: 10px; margin-top: 18px; }
.topic { display: grid; grid-template-columns: 132px 1fr; gap: 14px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; cursor: pointer; }
.topic .thumb { border-radius: 6px; overflow: hidden; background: var(--art-bg); aspect-ratio: 16 / 9; max-width: 100%; }
.topic .thumb svg { display: block; width: 100%; height: 100%; }
.topic .tx { min-width: 0; display: grid; gap: 3px; }
.topic .num { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.topic h3 { font-size: 21px; }
.topic p { margin: 0; font-size: 13.5px; color: var(--muted); }
.done { color: var(--ok); font-weight: 700; font-size: 12px; display: inline-flex; gap: 4px; align-items: center; }
@media (max-width: 480px) { .topic { grid-template-columns: 96px 1fr; } .topic h3 { font-size: 19px; } .topic p { display: none; } }
.quizcta { margin-top: 18px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; background: var(--lcd-bg); color: var(--lcd-fg); border-radius: 10px; padding: 16px; }
.quizcta strong { font-family: var(--f-display); font-size: 22px; font-weight: 600; }
.quizcta span { display: block; font-size: 13px; opacity: .85; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--signal); color: var(--signal-ink); border-color: var(--signal); }
.sources { margin-top: 26px; font-size: 13px; color: var(--muted); }
.sources ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; }
.sources a { overflow-wrap: anywhere; }

/* Konu sayfası */
.art { border-radius: 10px; overflow: hidden; background: var(--art-bg); margin-top: 8px; aspect-ratio: 16 / 9; max-width: 100%; }
.art svg { display: block; width: 100%; height: 100%; }
.cap { font-size: 12px; color: var(--muted); margin-top: 6px; }
.lesson { display: grid; gap: 14px; margin-top: 18px; }
.lesson h2.tt { font-size: 34px; }
.lesson h3 { font-size: 22px; margin-top: 8px; }
.lesson p { margin: 0; max-width: 66ch; }
.lesson ul, .lesson ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; max-width: 66ch; }
.box { border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; max-width: 66ch; }
.box b { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
.box.tip { background: var(--ok-soft); }
.box.tip b { color: var(--ok); }
.box.warn { background: var(--fault-soft); }
.box.warn b { color: var(--fault); }
.tblw { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
td.n { font-variant-numeric: tabular-nums; white-space: nowrap; }
.lcd { font-family: var(--f-mono); font-size: 13px; font-weight: 600; background: var(--lcd-bg); color: var(--lcd-fg); padding: 2px 8px; border-radius: 4px; }
.pager { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 16px; margin-top: 10px; }
.pager .btn { max-width: 100%; }
.mark-done[aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }

/* Test */
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; }
.q h3 { font-family: var(--f-body); font-size: 16px; font-weight: 700; line-height: 1.4; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--signal); }
.opt:disabled { cursor: default; color: var(--ink); }
.why { font-size: 14px; color: var(--muted); }
.score { font-family: var(--f-display); font-size: 24px; }

/* Panel mesajları */
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0 8px; scrollbar-width: thin; max-width: 100%; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
#msgq { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; }
.msglist { display: grid; gap: 10px; }
.msglist .secttl { margin: 16px 0 0; }
.msg { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; scroll-margin-top: calc(90px + env(safe-area-inset-top, 0px)); }
.msg.pre { margin-top: 16px; border-color: var(--fault); background: var(--fault-soft); }
.msg > summary { list-style: none; cursor: pointer; padding: 14px; display: grid; gap: 8px; }
.msg > summary::-webkit-details-marker { display: none; }
.msg > summary h3 { font-size: 21px; }
.msg > summary h3::after { content: " ›"; color: var(--muted); }
.msg[open] > summary h3::after { content: " ⌄"; }
.mhead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.urg { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; color: var(--signal-ink); }
.urg.acil { background: var(--signal); } .urg.oncelikli { background: var(--fault); } .urg.planli { background: var(--muted); }
.mcat { font-size: 12px; color: var(--muted); }
.mex { display: flex; flex-wrap: wrap; gap: 6px; }
.mex .lcd { font-size: 12px; }
.mbody { padding: 0 14px 16px; display: grid; gap: 12px; min-width: 0; }
.mbody p { margin: 0; }
.mbody h4 { margin: 4px 0 0; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.mbody ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.mgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.proc { margin: 0; padding: 0; list-style: none; counter-reset: p; display: grid; gap: 10px; }
.proc li { counter-increment: p; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.proc li::before { content: counter(p); font-family: var(--f-mono); font-weight: 600; font-size: 13px; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; }
.mfoot { display: flex; gap: 8px; flex-wrap: wrap; }
.empty { text-align: center; padding: 32px 12px; color: var(--muted); }
.empty h2 { font-size: 22px; color: var(--ink); }

.sep { display: flex; align-items: center; gap: 12px; margin-top: 18px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--signal); }
.sep::before, .sep::after { content: ""; height: 2px; background: var(--signal); opacity: .35; flex: 1; }
.sep::before { flex: 0 0 16px; }

/* Mühendislik ve araçlar */
.lead.sm { margin: 0 0 12px; font-size: 14px; }
.brand.mod h2 { font-size: 23px; }
.brand .num { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.tools3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.formula { font-family: var(--f-mono); font-size: 13px; background: var(--chip); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; overflow-x: auto; max-width: 100%; }
.formula div { white-space: pre-wrap; overflow-wrap: anywhere; }
.lesson .golink { justify-self: start; }
.calcs { display: grid; gap: 14px; margin-top: 18px; }
.calc { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.calc h3 { font-size: 24px; }
.calc > p { margin: 0; font-family: var(--f-mono); font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.cfields { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.cf { display: grid; gap: 4px; font-size: 13px; font-weight: 600; min-width: 0; }
.cf input, .cf select, .search input#glq { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; font-size: 16px; font-weight: 400; font-variant-numeric: tabular-nums; }
.cout { display: grid; border-top: 1px solid var(--line); }
.crow { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; flex-wrap: wrap; }
.crow b { font-variant-numeric: tabular-nums; text-align: right; }
.crow.ok b { color: var(--ok); } .crow.bad b { color: var(--signal); } .crow.warn b { color: var(--fault); }
.cnote { font-size: 13px; color: var(--muted); }
.cklist { display: grid; gap: 8px; margin-top: 18px; }
.ck { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; cursor: pointer; }
.ck input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--ok); }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.search { margin: 18px 0 10px; }

/* SVG çizimler */
.a-bg { fill: var(--art-bg); }
.a-box { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.a-ln { fill: none; stroke: var(--ink); stroke-width: 2; }
.a-ln2 { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
.a-lcd { fill: var(--lcd-bg); }
.a-lcdt { fill: var(--lcd-fg); font-family: var(--f-mono); font-size: 10px; font-weight: 600; }
.a-t { fill: var(--ink); font-family: var(--f-body); font-size: 10px; font-weight: 600; }
.a-tm { fill: var(--muted); font-family: var(--f-body); font-size: 9px; }
.a-big { fill: var(--ink); font-family: var(--f-display); font-size: 18px; font-weight: 600; }
.a-red { fill: var(--signal); }
.a-amb { fill: var(--fault); }
.a-grn { fill: var(--ok); }
.a-mut { fill: var(--muted); }
.a-dev { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.a-redln { fill: none; stroke: var(--signal); stroke-width: 2.5; }
.a-ambln { fill: none; stroke: var(--fault); stroke-width: 2.5; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="mark" aria-hidden="true"><i></i></div>
    <div class="t">
      <div class="eyebrow">MC Data Teknoloji · Saha eğitimi</div>
      <h1>Yangın Alarm Panel Eğitimleri</h1>
    </div>
  </header>
  <main id="view"></main>
</div>

<script>
(function () {
/* ================= ÇİZİMLER ================= */
const W = 320, H = 180;
const svg = (body) => `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img"><rect class="a-bg" width="${W}" height="${H}"/>${body}</svg>`;
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

function panelBox(x, y, w, h, lcd) {
  const t = String(lcd || "");
  const fs = Math.min(10, (w - 24) / Math.max(1, t.length * 0.62)).toFixed(1);
  return `<rect class="a-box" x="${x}" y="${y}" width="${w}" height="${h}" rx="4"/>
  <rect class="a-lcd" x="${x + 8}" y="${y + 8}" width="${w - 16}" height="${Math.min(26, h * 0.3)}" rx="2"/>
  <text class="a-lcdt" style="font-size:${fs}px" x="${x + 13}" y="${y + 8 + Math.min(26, h * 0.3) / 2 + 3.5}">${esc(t)}</text>`;
}
const ART = {
  panel: (o) => svg(`
    ${panelBox(70, 18, 180, 146, o.lcd)}
    <circle class="a-red" cx="92" cy="72" r="5"/><text class="a-t" x="102" y="75">YANGIN</text>
    <circle class="a-amb" cx="92" cy="90" r="5"/><text class="a-t" x="102" y="93">ARIZA</text>
    <circle class="a-amb" cx="92" cy="108" r="5"/><text class="a-t" x="102" y="111">DEVRE DIŞI</text>
    <circle class="a-grn" cx="92" cy="126" r="5"/><text class="a-t" x="102" y="129">ŞEBEKE</text>
    ${[0,1,2].map(r => [0,1,2].map(c => `<rect class="a-box" x="${180 + c * 20}" y="${66 + r * 20}" width="15" height="15" rx="2"/>`).join("")).join("")}
    <text class="a-tm" x="78" y="155">${esc(o.note || "")}</text>`),

  loop: (o) => {
    const devs = [[150, 30], [210, 30], [270, 30], [295, 90], [270, 150], [210, 150], [150, 150]];
    return svg(`
    ${panelBox(14, 52, 86, 76, o.lcd || "LOOP 1")}
    <path class="a-ln" d="M100 78 H118 V30 H295 V150 H118 V102 H100"/>
    ${devs.map(([x, y], i) => `<circle class="a-dev" cx="${x}" cy="${y}" r="9"/><text class="a-tm" x="${x - 3}" y="${y + 3}">${i + 1}</text>`).join("")}
    ${[[180, 30], [240, 150]].map(([x, y]) => `<rect class="a-amb" x="${x - 5}" y="${y - 5}" width="10" height="10" transform="rotate(45 ${x} ${y})"/>`).join("")}
    <text class="a-big" x="130" y="98">${esc(o.label)}</text>
    <text class="a-tm" x="130" y="114">${esc(o.cap || "")}</text>
    <text class="a-tm" x="130" y="127">${esc(o.len || "")}</text>
    <rect class="a-amb" x="20" y="160" width="7" height="7" transform="rotate(45 23.5 163.5)"/><text class="a-tm" x="32" y="167">izolatör</text>`);
  },

  devices: (o) => {
    const items = o.items || ["Optik", "Isı", "Multi", "Buton", "Siren", "Modül"];
    const cell = (x, y, kind, label) => {
      let g = "";
      if (kind === "btn") g = `<rect class="a-red" x="${x - 18}" y="${y - 18}" width="36" height="36" rx="3"/><rect class="a-box" x="${x - 9}" y="${y - 9}" width="18" height="18"/>`;
      else if (kind === "snd") g = `<circle class="a-red" cx="${x}" cy="${y}" r="18"/><circle class="a-dev" cx="${x}" cy="${y}" r="7"/>`;
      else if (kind === "mod") g = `<rect class="a-box" x="${x - 20}" y="${y - 14}" width="40" height="28" rx="3"/><circle class="a-amb" cx="${x - 10}" cy="${y}" r="3"/><circle class="a-grn" cx="${x}" cy="${y}" r="3"/>`;

    { id: "kisa", title: "Kısa devre ve izolatör açık", summary: "Hasarlı kablo, buatta su, yanlış soket bağlantısı.", art: { type: "loop", label: "Kısa devre", cap: "İzolatörler arızalı bölümü ayırır", len: "ML-5200: G: / D: / OOR", lcd: "KISA DEVRE" },

    { id: "toprak", title: "Toprak hatası (toprak kaçağı)", summary: "İzolasyon hasarı, ekranın iletkene değmesi, su.", art: { type: "fault", lcd: "TOPRAK ARIZA" },

"bosch/aile": [
  { h: "Modüler yapı sahada ne demek?" },
  { p: "AVENAR panellerinde her işlev ayrı bir modüldür: loop modülü (LSN), güç modülü, röle modülü, arayüz modülü. Modüller panel rayına takılır ve her birinin önünde durum LED’leri bulunur. Bir arıza olduğunda önce raydaki LED’lere bakmak, arızanın hangi modülle ilgili olduğunu çoğu zaman tek bakışta gösterir." },
  { h: "Doğru paneli seçmek" },
  { p: "AVENAR panel 2000 küçük ve orta binalar içindir (4 loop’a kadar). Ağa bağlanması için premium lisans gerekir. AVENAR panel 8000 büyük binalar için 32 loop’a kadar çıkar. Eski binalarda FPA-5000 serisi bulunur; bu paneller AVENAR ile aynı ağda çalışabilir ve AVENAR kontrolörüne yükseltilebilir, yani tüm sistemi sökmeden modernizasyon mümkündür." },
  { h: "Kapasite sınırlarını yorumlamak" },
  { p: "8000 serisinde tek panel 4096 eleman yönetebilir; ağdaki her panel ise 2048 ile sınırlıdır. Tek başına çalışan büyük bir paneli ağa bağlamayı planlıyorsanız eleman sayısının bu sınırın altında olduğunu kontrol edin." }
],
"bosch/lsn": [
  { h: "LSN classic ve LSN improved farkı" },
  { p: "LSN improved, Bosch’un yeni nesil loop protokolüdür: loop başına 254 eleman, T-tap (kol) bağlantıları ve daha uzun kablo sağlar. Eski LSN classic elemanlar da aynı modüle bağlanabilir, ancak loop’ta classic eleman varsa kapasite 127 elemanla sınırlanır. Eski bir binaya yeni dedektör eklerken loop’ta classic eleman olup olmadığını kontrol edin." },
  { h: "LSN 0300 A mı, LSN 1500 A mı?" },
  { p: "Fark, loop’a verilebilecek akımdır. LSN 0300 A 300 mA ve 1600 m kabloya izin verir. LSN 1500 A alarmda 1500 mA ve 3000 m’ye izin verir. Loop’tan beslenen siren ve flaşör sayısı fazlaysa veya kablo uzunsa 1500 A modül gerekir. Seçim tahminle değil, Fire System Designer (FSD) hesabıyla yapılır." },
  { h: "Hat sonu modülü" },
  { p: "LSN improved’da her kol hattı ve T-tap’ın sonuna FLM-420-EOL2W-W hat sonu modülü takılır. Bu modül kol hattının sonuna kadar sağlam olduğunu panele bildirir. Modül yoksa kol hattının kopması fark edilmeyebilir; bu nedenle EN 54-13 uyumu için zorunludur." },
  { h: "Sık yapılan hatalar" },
  { ul: [
    "Loop’a sonradan siren eklemek ve akım hesabını güncellememek: alarmda gerilim düşer, uzak cihazlar kaybolur.",
    "T-tap ucuna hat sonu modülü takmamak.",
    "LSN 1500 A modülünü rayın sağ tarafına takmaya çalışmak: modül yalnızca sol tarafa takılır ve iki yer kaplar."
  ] }
],
"bosch/kullanim": [
  { h: "Dokunmatik ekranla çalışmak" },
  { p: "AVENAR panelinin 8 inçlik dokunmatik ekranı olayları liste halinde gösterir. Sabit tuşlar temel işlevler (kabul, sustur, reset gibi) içindir; programlanabilir üç fonksiyon tuşuna sık kullanılan işlemler atanabilir. Durum LED’leri ekran kapalı olsa bile genel durumu gösterir." },
  { h: "Olay kaydını kullanmak" },
  { p: "Panel 10.000 mesaj saklar. Arıza ziyaretinde ilk iş olay kaydından arızanın başlangıç zamanını ve tekrar edip etmediğini bulmaktır. Kayıt dışa aktarılabilir; servis formuna ekleyin." },
  { warn: "Menü adları yazılım sürümüne göre değişebilir. Müşteriye kullanım eğitimi verirken o panelin kullanım kılavuzundaki adımları gösterin ve panel yanına kısa kullanım talimatı asın." }

"bosch/program": [

"bosch/ariza": [
  { h: "Modül LED’leriyle başlayın" },

"esser/aile": [
  { h: "IQ8Control mı, FlexES Control mü?" },
  { p: "IQ8Control (C ve M) küçük ve orta binalar içindir; 2 esserbus loop’u ve kol hatlarıyla genişler. FlexES Control modüler bir paneldir; loop modülleri yuvalara takılarak 18 loop’a kadar çıkar. Sahada iki panel ailesinin modülleri birbirinin yerine kullanılmaz." },
  { h: "Galvanik izolasyonlu (GI) modül neden gerekli?" },
  { p: "Galvanik izolasyon, loop’un elektriksel olarak panelin diğer devrelerinden ayrılması demektir. Loop sayısı arttıkça loop’lar arasındaki toprak kaçakları ve potansiyel farkları birbirini etkileyebilir. FlexES Control’de beşinci loop modülünden itibaren GI modül kullanılması bu etkileşimi önler. Panele loop eklerken modül tipini mutlaka kontrol edin." },
  { h: "Panel çalışırken modül takmak" },
  { p: "FlexES Control modülleri panel çalışırken takılabilir ve otomatik tanınır. Bu, genişletme sırasında tüm binanın korumasız kalmasını önler. Yine de işlem öncesinde bina yönetimini bilgilendirin ve takılan modülün panelde tanındığını kontrol edin." }
],
"esser/loop": [

  { p: "esserbus klasik loop’tur: 127 cihaz ve 3,5 km kablo. esserbus-PLus loop’tan beslenen sesli uyarı cihazlarını (ör. IQ8Alarm Plus) destekler; bu cihazlar daha fazla akım çektiği için loop uzunluğu 2 km ile sınırlanır. Siren eklenecek bir loop’un hangi tipte olduğunu kontrol edin." },
  { h: "Kısa devreden sonra sirenler" },
  { p: "Loop kısa devreye karşı dayanıklıdır; kısa devre ortadan kalktıktan sonra alarm cihazları 5 saniye içinde yeniden devreye alınabilir. Kısa devre yaşanmış bir loop’ta arıza giderildikten sonra bir alarm testiyle sirenlerin tekrar çalıştığını doğrulayın." },
  { h: "Örnek hesap" },
  { p: "FlexES esserbus modülünde loop’tan beslenen IQ8Alarm Plus cihazı en fazla 64, sirenli IQ8Quad dedektör en fazla 48 adettir. 100 odalı bir otel katında her odaya sirenli dedektör konacaksa tek loop yetmez; cihazlar en az üç loop’a dağıtılmalıdır." }
],
"esser/cihaz": [

  { h: "Sirenli dedektör" },
  { p: "Sesli uyarı cihazlı IQ8Quad dedektörler ayrı siren hattına ihtiyaç duymaz; hem algılar hem uyarır. Otel odası gibi her odada siren gereken yerlerde kablolamayı azaltır. Ancak bu cihazlar loop akımını artırır; loop başına sayı sınırına uyun." },
  { tip: "Eski binalarda Series 9200 dedektörleriyle karşılaşabilirsiniz. Bunlar esserbus uyumludur, ancak yedek alırken güncel karşılığını ve panelin desteklediğini üreticiden doğrulayın." }

  { p: "Katalitik sensör farklı gazlara farklı hassasiyetle tepki verir. Örneğin propan için kullanılacak bir dedektör metan test gazıyla kalibre ediliyorsa, okunan değer üreticinin çarpan cetvelindeki faktörle düzeltilir. Hangi gazla ve hangi çarpanla kalibre edildiği müşteriye yazılı olarak bildirilmelidir; aksi halde sonraki bakımda farklı bir değer uygulanabilir." },
  { h: "Örnek: 4–20 mA okuması" },
  { p: "0–100 % LEL ölçen bir dedektörden 8 mA okunuyorsa değer (8 − 4) / 16 × 100 = %25 LEL’dir. 10 Ω ölçüm direnci üzerinde bu akım 80 mV olarak ölçülür." },
  { go: ["4–20 mA hesaplayıcısını aç", "araclar"] }
],
"gaz/ex": [
  { h: "Etiketi okumak: örnek" },
  { p: "“Ex II 2 GD Ex d IIC T6 Gb” işaretli bir cihaz:" },
  { ul: [
    "II: yerüstü endüstrisi (madencilik değil).",
    "2: Kategori 2, yani zone 1 ve zone 2 için uygun (zone 0 için değil).",
    "GD: hem gaz hem toz ortamı.",
    "Ex d: alev sızdırmaz muhafaza; içeride patlama olsa bile dışarıya alev çıkmaz.",
    "IIC: en zorlu gaz grubu (hidrojen, asetilen); IIA ve IIB gazlarında da kullanılabilir.",
    "T6: yüzey sıcaklığı en fazla 85 °C; tutuşma sıcaklığı 85 °C’nin üzerindeki gazlarda güvenli."
  ] },
  { h: "Sıcaklık sınıfı neden önemli?" },
  { p: "Cihazın yüzeyi, ortamdaki gazın kendiliğinden tutuşma sıcaklığından daha soğuk olmalıdır. Hekzanın tutuşma sıcaklığı 233 °C’dir; bu ortamda en az T3 (200 °C) cihaz gerekir. T6 cihaz tüm sınıfları karşılar." }
],
"gaz/bariyer": [
  { h: "Özgüvenlik nasıl çalışır?" },
  { p: "Özgüvenlikli (Ex i) devrede, tehlikeli bölgeye giden enerji o kadar sınırlandırılır ki kısa devre veya kopma anında bile gazı tutuşturacak kıvılcım ya da ısı oluşamaz. Bu sınırlamayı güvenli alandaki bariyer yapar. Zener bariyer enerjiyi zener diyot ve dirençlerle sınırlar ve fazla akımı toprağa akıtır; bu yüzden temiz ve düşük dirençli (≤ 1 Ω) bir özgüvenlik toprağı şarttır. Galvanik izolatör ise devreyi elektriksel olarak ayırır ve toprak gerektirmez." },
  { h: "Neden bariyer başına cihaz sınırı var?" },
  { p: "Bariyer çok az enerji geçirdiği için arkasına bağlanabilecek dedektör sayısı sınırlıdır. Fazla cihaz bağlanırsa dedektörler yeterli gerilimi alamaz ve alarm vermez. Örneğin MTL 7778ac arkasında en fazla 8 dedektör kullanılır." },
  { warn: "Özgüvenlikli devreler mavi kablo veya mavi işaretle diğer devrelerden ayrılmalı ve aynı buat içinde normal devrelerle karıştırılmamalıdır. Bariyer arkasına sertifikasız bir cihaz eklemek özgüvenliği bozar." }
],

/* ---- Devreye Alma, Bakım ve Arıza Bulma ---- */
"saha/devreye": [
  { h: "Keşif aşamasında sorulacaklar" },
  { ul: [
    "Montaj tamamlandı mı, kablolar test edilmeye hazır mı?",
    "Senaryolar için hangi sistemlerin (asansör, HVAC, kapılar, söndürme) yüklenicileriyle koordinasyon gerekiyor ve onlar sahada olacak mı?",
    "Elektrik kesintisi ve alarm testleri için hangi saatlerde çalışılabilir?",
    "İtfaiyeye veya izleme merkezine iletim var mı, test sırasında kime haber verilecek?"
  ] },
  { h: "Teslimde kullanıcı eğitimi" },
  { p: "Kullanıcı eğitimi sadece tuşları göstermek değildir. Kullanıcıya alarmda ne yapacağı (mesajı okumak, yeri kontrol ettirmek, gerçekse tahliye ve itfaiye), yalancı alarmda ne yapacağı (susturmak, sebebi bulmak, resetlemek), arızada kimi arayacağı ve devre dışı bırakmanın riskleri anlatılır. Eğitim katılımcıların imzasıyla belgelenir." },
  { tip: "Devreye alma sonunda grafik izleme programı kurulduysa kat planlarındaki cihaz ikonlarının gerçek adreslerle eşleştiğini birkaç rastgele cihazı alarma geçirerek kontrol edin." }
],
"saha/testler": [
  { h: "Arıza simülasyonu neden yapılır?" },
  { p: "Sistemin alarm verdiğini görmek yetmez; arızaları da doğru bildirdiğini görmek gerekir. Her devrede bir kez kablo sökülür (açık devre), bir kez kısa devre yapılır, bir cihaz çıkarılır, şebeke kesilir ve akü sökülür. Her durumda panelin doğru arızayı, doğru yerde ve belirlenen süre içinde gösterdiği kaydedilir." },
  { h: "Akü testinde sıra" },
  { ol: [
    "Akü bağlıyken set gerilimini ölçün (26,3–28,9 V).",
    "230 V şebekeyi kapatın; panel şebeke hatası vermelidir.",
    "Aküden çalışırken bir bölgede yangın alarmı verin; panel alarma geçmeli, sirenler çalmalıdır.",
    "Şebekeyi tekrar açın, paneli resetleyin, şebeke hatasının silindiğini görün."
  ] },
  { tip: "Test sonuçlarını tablo halinde kaydedin: cihaz adresi, test yöntemi, sonuç, tarih, test eden. Bu tablo kabul tutanağının ve sonraki bakımların temelidir." }
],
"saha/teslim": [
  { h: "Dokümanlar neden bu kadar önemli?" },
  { p: "Teslimden yıllar sonra arızaya giden teknisyenin elindeki tek bilgi bu dokümanlardır. Adresleri işlenmiş as-built proje olmadan bir cihazın yeri, kablo güzergâhı bilinmeden de bir kopukluğun yeri tahminle aranır. Konfigürasyon yedeği yoksa panel arızalandığında tüm metinler ve senaryolar yeniden girilmek zorunda kalır." },
  { h: "Teslim dosyası kontrolü" },
  { ul: [
    "As-built projelerde her cihazın çevrim ve adres numarası yazılı mı?",
    "Sebep-sonuç matrisi son halini mi gösteriyor?",
    "Konfigürasyon yedeği hem müşteride hem ofiste var mı?",
    "Test kayıtları imzalı mı?",
    "Kayıt defteri panelin yanında mı?"
  ] }
],
"saha/bakim": [
  { h: "Bakımda dedektör testi nasıl dağıtılır?" },
  { p: "Yıllık bakımda her cihazın test edilmiş olması gerekir. 3 aylık bakım yapılan bir binada her ziyarette cihazların yaklaşık dörtte biri test edilir; yıl sonunda hepsi tamamlanır. Test edilen adresler listede işaretlenir ki bir sonraki ziyaret kalan cihazlardan devam etsin." },
  { h: "Bakım raporunda neler olmalı?" },
  { ul: [
    "Test edilen cihazlar ve sonuçları.",
    "Bulunan arızalar ve giderilenler.",
    "Giderilemeyen arızalar ve önerilen çözüm.",
    "Akü ölçümleri ve üretim tarihleri.",
    "Bina kullanımındaki değişiklikler ve sisteme etkisi.",
    "Devre dışı kalan cihaz varsa listesi ve nedeni."
  ] },
  { warn: "Bakım sırasında yapılan testler bina kullanıcılarını etkiler. Test başlamadan önce bina yönetimine ve gerekiyorsa izleme merkezine haber verin, bitince sistemin normale döndüğünü bildirin." }
],
"saha/servis": [
  { h: "Arızaya gitmeden önce sorulacak sorular" },
  { ol: [
    "Panelin markası ve modeli nedir? (Fotoğraf isteyin.)",
    "Ekranda tam olarak ne yazıyor?",
    "Arıza ne zaman başladı, sürekli mi, gelip gidiyor mu?",
    "Son zamanlarda binada tadilat, boya, temizlik veya elektrik işi yapıldı mı?",
    "Panelde devre dışı bırakılmış bir şey var mı?"
  ] },
  { p: "Bu soruların cevabı hangi yedek parçaların, yazılımın ve ölçü aletinin götürüleceğini belirler ve sahada geçen süreyi kısaltır." },
  { h: "Servis formunu doldururken" },
  { p: "Formda “arıza giderildi” yazmak yetmez. Arızanın nedeni (ör. “2. kat koridor buatında su, kablo oksitlenmiş”), yapılan işlem (“buat değiştirildi, klemensler yenilendi”), kullanılan malzeme ve müşteriye önerilen kalıcı çözüm (“çatı sızıntısı giderilmeli”) yazılmalıdır. Bu bilgi, arıza tekrar ederse bir sonraki teknisyenin işini kolaylaştırır." }
],
"saha/arizabulma": [
  { h: "Tablonun kullanımı" },
  { p: "Bu tablo bir hızlı bakış listesidir: belirtiyi bulun, olası nedenleri okuyun, ilk kontrolü yapın. Her arıza tipinin adım adım anlatımı, gerekli ekipman ve örnek durumlar Arıza Bulma Rehberi modülündedir. Sahadan ölçtüğünüz direnci yorumlamak için Hesaplayıcılar sayfasındaki ölçüm yorumlayıcıyı kullanabilirsiniz." },
  { go: ["Ölçüm yorumlayıcıyı aç", "araclar"] }
],

/* ---- Arıza Bulma Rehberi: örnek durumlar ---- */
"ariza/yontem": [
  { h: "Neden önce bilgi, sonra ölçüm?" },
  { p: "Arıza bulmada zamanın çoğu yanlış yerde arayarak kaybedilir. Olay kaydı, ekrandaki adres ve son yapılan işler genellikle arızanın bulunduğu devreyi ve hatta bölümü gösterir. Ölçüme ancak arıza tek bir devreye indirildikten sonra geçilir." },
  { h: "Yarıya bölmenin hesabı" },
  { p: "Her bölme aranacak alanı yarıya indirir. 32 cihazlık bir hatta 1. bölmeden sonra 16, 2.’den sonra 8, 3.’den sonra 4, 4.’den sonra 2 cihaz kalır; 5. bölmede arızalı nokta bulunur. Cihazları tek tek gezmek ise en kötü durumda 32 kontrol demektir." },
  { warn: "Enerjili bir devrede kablo sökmek veya ölçüm yapmak hem cihazlara zarar verebilir hem de panelde gereksiz alarmlara yol açar. Ölçüm yapacağınız devreyi panelde devre dışı bırakın ve santral ucundan sökün." }
],
"ariza/sonra": [
  { h: "Neden tekrar test?" },
  { p: "Arızanın panelden silinmesi, sistemin doğru çalıştığını göstermez. Örneğin kısa devre giderildikten sonra izolatör bölümündeki cihazlar geri gelmiş görünür ama bir dedektörün adresi yanlış girilmiş olabilir. Etkilenen her cihaz gerçek bir testle (aerosol, ısı, test anahtarı) alarma geçirilip panelde doğru adres ve metinle göründüğü doğrulanmalıdır." },
  { h: "Tekrarlayan arıza" },
  { p: "Aynı arıza birkaç kez tekrar ediyorsa sebep kalıcı olarak giderilmemiştir. Servis formuna önceki ziyaretlerde ne yapıldığını yazın ve kök nedeni (nemli buat, tadilat, yanlış dedektör tipi) müşteriye yazılı bildirerek kalıcı çözüm önerin." }
],
"ariza/acik": [
  { h: "Örnek durum" },
  { p: "Bir okulda konvansiyonel 4. bölge her sabah “hat kopuk” arızası veriyor, öğlene doğru kayboluyor. Santral ucunda hat sökülüp ölçüldüğünde değer zaman zaman 6,9 kΩ, zaman zaman sonsuz okunuyor. Hat yarıya bölünüyor; sorun ikinci yarıda. Bir sınıfın tavanındaki dedektör soketinde klemens gevşek; sabah kalorifer yanınca tavan ısınıp genleşiyor ve temas kopuyor. Klemens sıkılıyor, arıza tekrar etmiyor." }
],
"ariza/kisa": [
  { h: "Örnek durum" },
  { p: "Yeni açılmış bir mağazada çevrim 2’de 12 cihaz aynı anda kayboluyor ve “izolatör açık” arızası var. Kaybolan ilk ve son adres proje üzerinde mağazanın vitrin bölümünde. Vitrin montajı sırasında alçıpan vidası bir kablonun içinden geçmiş. Kablo değiştiriliyor, çevrim bağlanıyor, 12 cihaz geri geliyor." }
],
"ariza/toprak": [
  { h: "Örnek durum" },
  { p: "Bir otoparklı binada toprak hatası yağmurlu günlerde çıkıyor. Santral enerjiliyken devreler sırayla sökülüyor; otopark çevrimi söküldüğünde hata kayboluyor. ML-5200 menü 2 “− Kaçak” gösteriyor. Otopark rampasındaki bir buatın içine yağmur suyu dolmuş. Buat su geçirmez tiple değiştiriliyor ve kablo girişleri rakorla kapatılıyor." }
],
"ariza/cihaz": [
  { h: "Örnek durum" },
  { p: "Bakım ekibi bir dedektörü değiştirdikten sonra panelde hem “çift adres” hem “cihaz yok” arızası çıkıyor. Yeni dedektör eski cihazın adresi yerine fabrikadan gelen bir adresle takılmış ve bu adres başka bir odadaki dedektörle çakışıyor. Yeni dedektöre adresleme cihazıyla eski cihazın adresi veriliyor; iki arıza da kayboluyor." }
],
"ariza/guc": [
  { h: "Örnek durum" },
  { p: "Bir panelde BF (akü) hatası var. Akü seti 24,1 V ölçülüyor; aküler ayrı ölçüldüğünde biri 12,7 V, diğeri 11,4 V. Akülerin üzerinde 6 yıl önceki üretim tarihi var. İki akü birlikte değiştiriliyor, set gerilimi şarjda 27,2 V’a çıkıyor, aküden çalışma testi yapılıyor ve BF hatası siliniyor." }
],
"ariza/siren": [
  { h: "Örnek durum" },
  { p: "Bir binada siren hattı 2 sürekli kısa devre arızası veriyor. Hat sökülüp iki yönde ölçüldüğünde iki yönde de birkaç yüz ohm okunuyor. Hat yarıya bölünüyor; sorunlu yarıda yeni eklenen bir flaşörlü sirenin + ve − uçları ters bağlanmış. Polarite düzeltiliyor; bir yönde 10,2 kΩ okunuyor ve arıza kayboluyor." }
],
"ariza/modul": [
  { h: "Örnek durum" },
  { p: "Bir binada sprinkler akış anahtarı girişi devreye almadan beri hiç arıza vermemiş. Bakımda kablo modülden sökülünce de arıza gelmiyor. Modül klemensinde 33 kΩ’luk hat sonu direnci takılı; sahadaki kablo hiç izlenmiyor. Direnç akış anahtarının yanına taşınıyor, kablo test ediliyor ve sökülünce açık devre arızası geldiği görülüyor." }
],
"ariza/ozel": [
  { h: "Örnek durum" },
  { p: "Bir lojistik deposunda ışın dedektörü her öğleden sonra arıza veriyor. Sinyal değeri sabah normal, öğleden sonra aralık dışı. Reflektör, güneşte ısınan hafif çelik cephe kaplamasına monte edilmiş; kaplama genleşince reflektörün açısı değişiyor. Reflektör beton kolona taşınıyor, yeniden hizalanıyor ve test filtreleriyle doğrulanıyor." }
],
"ariza/network": [
  { h: "Örnek durum" },
  { p: "Üç santrallik bir ring network’te santral 2 ara sıra “network hatası” veriyor ama iletişim kesilmiyor. Ring tek noktadan koptuğunda veri diğer yönden dolaştığı için bu beklenen davranıştır. Santral 2’nin sağ portuna giden kablonun bir ek kutusunda drenaj telinin iletkene değdiği bulunuyor. Ek yenileniyor; ring iki yönde de çalışınca hata siliniyor." }
],
"ariza/yalanci": [
  { h: "Örnek durum" },
  { p: "Bir ofiste her sabah 07:30 civarında koridorda yalancı alarm oluyor. Olay kaydı alarmın hep aynı dedektörden geldiğini gösteriyor. Dedektör, temizlik ekibinin her sabah kullandığı aerosol oda spreyinin sıkıldığı WC kapısının hemen önünde. Dedektör kapıdan uzaklaştırılıyor ve temizlik ekibine bilgi veriliyor; yalancı alarm tekrar etmiyor." }
],

/* ---- Ürün Geliştirme ---- */
"urun/blok": [
  { h: "Her bloğun görevi" },
  { ul: [
    "İzolatör: kısa devrede cihazın iki yanındaki hattı ayırır.",
    "Köprü: cihaz ters bağlansa da doğru polaritede besleme sağlar; montaj hatasını önler.",
    "Regülatör ve tampon kondansatör: değişken çevrim geriliminden kararlı 3,3 V üretir; haberleşme darbeleri ve LED akımı sırasında beslemeyi korur.",
    "RX / TX: panelden gelen gerilim darbelerini bit olarak çözer; cevabı akım darbeleriyle gönderir.",
    "MCU ve EEPROM: algılama algoritması, adres ve kalibrasyon verileri.",
    "IR LED ve fotodiyot: duman ölçümü. NTC: sıcaklık ölçümü."
  ] },
  { h: "Hazne tasarımındaki denge" },
  { p: "Labirent ortam ışığını ve böcekleri dışarıda tutmalı, ama dumanın düşük hava hızında bile kolayca girmesine izin vermelidir. Çok kapalı hazne dumanı geç alır ve yavaş gelişen yangın testlerinde (EN 54-7) geç tepki verir; çok açık hazne ise ortam ışığından ve tozdan etkilenir. Bu denge tasarımın en zor kısmıdır ve duman tünelinde test edilerek ayarlanır." }
],
"urun/sinyal": [
  { h: "Senkron algılamanın mantığı" },
  { p: "Fotodiyot sadece LED ışığını değil, ortam ışığını ve elektronik gürültüyü de görür. LED kapalıyken bir ölçüm, açıkken bir ölçüm alınıp farkı hesaplanırsa ortam ışığı ve sabit ofset birbirini götürür; geriye sadece LED ışığının saçılmasından gelen sinyal kalır." },
  { h: "Neden doğrulama gerekir?" },
  { p: "Bir böceğin haznenin önünden geçmesi veya bir elektrik paraziti tek bir ölçümde yüksek değer üretebilir. Alarm için birkaç ardışık ölçümde yüksek değer veya artan bir eğilim aranırsa bu tür tek seferlik sıçramalar elenir. Ancak doğrulama süresi uzatılırsa gerçek yangında alarm gecikir; EN 54-7 tepki süresi testleri bu dengeyi kontrol eder." }
],
"urun/guc": [
  { h: "Güç bütçesi örneği" },
  { p: "Bir çevrimde 120 dedektör (her biri 300 µA) ve 7 modül (her biri 1,5 mA) varsa sükunet akımı 36 mA + 10,5 mA = 46,5 mA olur. Dedektör başına akım 600 µA olsaydı sadece dedektörler 72 mA çekerdi. Bu fark hem çevrim kartının kapasitesini hem de 72 saatlik akü hesabını doğrudan etkiler: 36 mA fark 72 saatte 2,6 Ah, 1,25 faktörüyle yaklaşık 3,2 Ah ek akü demektir." },
  { h: "İzolatör seri direnci neden önemli?" },
  { p: "Her izolatör çevrime küçük bir seri direnç ekler. Her cihazda izolatör olan bir tasarımda 120 izolatör × 0,15 Ω = 18 Ω eder; bu, uzun bir çevrimin kablo direncinin dörtte biri kadar olabilir. Bu yüzden izolatör seri direnci mümkün olduğunca düşük tasarlanır ve gerilim düşümü hesabına eklenir." }
],
"urun/tiptest": [
  { h: "Testlerin amacı" },
  { ul: [
    "Yangın testleri (TF2–TF5): dedektörün farklı yangın tiplerini (için için yanan ahşap ve pamuk, alevli poliüretan, sıvı yangını) yeterince erken algıladığını gösterir.",
    "Tekrarlanabilirlik ve yeniden üretilebilirlik: aynı dedektörün ve farklı üretim parçalarının aynı şekilde tepki verdiğini gösterir.",
    "Çevresel testler: sıcak, soğuk, nem, titreşim ve darbe altında yalancı alarm vermeden çalıştığını gösterir.",
    "EMC testleri: telsiz, cep telefonu, elektrostatik boşalma ve şebeke darbeleri gibi elektriksel etkilerden etkilenmediğini gösterir.",
    "Dayanıklılık testleri: yıllarca kullanımı simüle eder (uzun süreli nem, SO₂ korozyonu)."
  ] },
  { tip: "Sertifikasyondan önce kendi laboratuvarınızda ön testler yapmak, onaylanmış kuruluşta başarısız olup testi tekrar ödemekten çok daha ucuzdur." }
],
"urun/santralmimari": [
  { h: "Neden ayrı bir watchdog işlemcisi?" },
  { p: "Ana işlemcinin yazılımı kilitlenirse, aynı işlemci bunu kendisi bildiremez. EN 54-2, yazılım dursa bile sistem hatasının gösterilmesini ister. Ayrı ve basit bir denetleyici, ana işlemciden düzenli “yaşıyorum” sinyali bekler; sinyal gelmezse sistem hatası LED’ini yakar ve hata rölesini bırakır." },
  { h: "Neden düşük protokol hızı?" },

        h("div", { class: "tx" },
          h("span", { class: "num" }, `KONU ${i + 1} / ${c.topics.length}`),
          h("h3", null, t.title),
          h("p", null, t.summary),
          isDone(c.id, t.id) ? h("span", { class: "done" }, "✓ Tamamlandı") : null)))),
    h("div", { class: "quizcta" },
      h("div", null, h("strong", null, "Kendini test et"), h("span", null, `${c.quiz.length} soru · ${c.name}`)),
      h("button", { type: "button", class: "btn primary", onclick: () => go("test-" + c.id) }, "Teste başla")),
    c.ref ? h("div", { class: "sources" }, "Kaynak: " + c.ref) : null,
    c.sources.length ? h("div", { class: "sources" }, "Kaynaklar (gerçek ürün fotoğrafları ve teknik föyler için):",
      h("ul", null, c.sources.map(([t, u]) => h("li", null, h("a", { href: u, target: "_blank", rel: "noopener noreferrer" }, t))))) : null
  ];
}

function renderBlock(b) {
  if (b.p) return h("p", null, b.p);
  if (b.h) return h("h3", null, b.h);
  if (b.ul) return h("ul", null, b.ul.map(x => h("li", null, x)));
  if (b.ol) return h("ol", null, b.ol.map(x => h("li", null, x)));
  if (b.sep) return h("div", { class: "sep" }, h("span", null, "Ayrıntılı anlatım"));
  if (b.f) return h("div", { class: "formula" }, b.f.map(x => h("div", null, x)));
  if (b.go) return h("button", { type: "button", class: "btn golink", onclick: () => go(b.go[1]) }, b.go[0] + " ›");
  if (b.tip) return h("div", { class: "box tip" }, h("b", null, "Sahada ipucu"), h("span", null, b.tip));
  if (b.warn) return h("div", { class: "box warn" }, h("b", null, "Dikkat"), h("span", null, b.warn));
  if (b.table) return h("div", { class: "tblw" }, h("table", null,
    h("thead", null, h("tr", null, b.table.head.map(x => h("th", null, x)))),
    h("tbody", null, b.table.rows.map(r => h("tr", null, r.map(x => h("td", null, x)))))));
  return null;
}

function viewTopic(c, t) {
  const i = c.topics.indexOf(t);
  const prev = c.topics[i - 1], next = c.topics[i + 1];
  const mark = h("button", { type: "button", class: "btn mark-done", "aria-pressed": String(isDone(c.id, t.id)) }, isDone(c.id, t.id) ? "✓ Tamamlandı" : "Tamamladım olarak işaretle");
  mark.addEventListener("click", () => {
    const k = c.id + "/" + t.id;
    if (PROG[k]) delete PROG[k]; else PROG[k] = 1;
    saveProg();
    mark.setAttribute("aria-pressed", String(!!PROG[k]));
    mark.textContent = PROG[k] ? "✓ Tamamlandı" : "Tamamladım olarak işaretle";
  });
  return [
    backBtn(c.name, "k-" + c.id),
    h("div", { class: "art", html: drawArt(t.art) }),
    h("div", { class: "cap" }, c.group === "muh" || c.kind === "general" ? "Şematik çizim" : "Şematik çizim · gerçek ürün görünümü için kurs sayfasındaki kaynaklara bakın"),
    h("article", { class: "lesson" },
      h("div", { class: "eyebrow" }, `${c.name} · Konu ${i + 1} / ${c.topics.length}`),
      h("h2", { class: "tt" }, t.title),
      t.blocks.map(renderBlock)),
    h("div", { class: "pager" },
      prev ? h("button", { type: "button", class: "btn", onclick: () => go(`k-${c.id}-${prev.id}`) }, "‹ " + prev.title) : h("span"),
      mark,
      next ? h("button", { type: "button", class: "btn primary", onclick: () => { if (!isDone(c.id, t.id)) { PROG[c.id + "/" + t.id] = 1; saveProg(); } go(`k-${c.id}-${next.id}`); } }, next.title + " ›")
           : h("button", { type: "button", class: "btn primary", onclick: () => { if (!isDone(c.id, t.id)) { PROG[c.id + "/" + t.id] = 1; saveProg(); } go("test-" + c.id); } }, "Teste geç ›"))
  ];
}

function viewQuiz(c) {
  let answered = 0, correct = 0;
  const scoreEl = h("div", { class: "score" }, `0 / ${c.quiz.length} doğru`);
  const qs = c.quiz.map((q, qi) => {
    const why = h("div", { class: "why", hidden: true }, q.why);
    const btns = q.opts.map((o, oi) => h("button", { type: "button", class: "opt" }, o));
    btns.forEach((b, oi) => b.addEventListener("click", () => {
      btns.forEach((x, xi) => { x.disabled = true; if (xi === q.a) x.classList.add("right"); });
      if (oi !== q.a) b.classList.add("wrong"); else correct++;
      answered++; why.hidden = false;
      scoreEl.textContent = `${correct} / ${c.quiz.length} doğru` + (answered === c.quiz.length ? (correct === c.quiz.length ? " · Tamamı doğru" : " · Yanlış cevapların konusunu tekrar okuyun") : "");
    }));
    return h("div", { class: "q" }, h("h3", null, `${qi + 1}. ${q.q}`), h("div", { class: "opts" }, btns), why);
  });
  return [
    backBtn(c.name, "k-" + c.id),
    h("div", { class: "chead" }, h("div", { class: "eyebrow" }, "Kendini test et"), h("h2", null, c.name + " testi")),
    h("div", { class: "topics" }, qs),
    h("div", { class: "pager" }, scoreEl,
      h("button", { type: "button", class: "btn", onclick: () => render() }, "Testi yeniden başlat"))
  ];
}

function render() {
  const r = location.hash.replace(/^#/, "");
  let nodes;
  if (r === "mesaj" || r.startsWith("mesaj-")) nodes = viewMsg(r.slice(6) || null);
  else if (r === "araclar") nodes = viewTools();
  else if (r === "kontrol") nodes = viewCheck();
  else if (r === "sozluk") nodes = viewGlossary();
  else if (r.startsWith("test-")) { const c = findC(r.slice(5)); nodes = c ? viewQuiz(c) : viewHome(); }
  else if (r.startsWith("k-")) {
    const [cid, tid] = r.slice(2).split(/-(.+)/);
    const c = findC(cid);
    const t = c && tid ? c.topics.find(x => x.id === tid) : null;
    nodes = !c ? viewHome() : t ? viewTopic(c, t) : viewCourse(c);
  } else nodes = viewHome();
  const v = document.getElementById("view");
  v.replaceChildren(...nodes.flat().filter(Boolean));
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);
render();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
